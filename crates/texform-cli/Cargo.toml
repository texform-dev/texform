[package]
name = "texform-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for TeXForm: parse, normalize, and tokenize LaTeX formulas, and serve the normalizer protocol"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "parser-implementations", "text-processing", "mathematics"]

[[bin]]
name = "texform"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
texform.workspace = true
