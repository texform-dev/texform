[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "texform"
description = "Python bindings for the TeXForm LaTeX parser"
readme = "python/texform/README.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.12"]
dynamic = ["version"]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[tool.maturin]
manifest-path = "crates/texform-python/Cargo.toml"
python-source = "python"
module-name = "texform._native"
features = ["pyo3/extension-module"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "python/texform/py.typed", format = "sdist" },
    { path = "python/texform/*.pyi", format = "sdist" },
]

[dependency-groups]
dev = [
    "datasets>=4.8.4",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.11.0",
    "maturin>=1.9.4,<2",
    "patchelf>=0.17.2.4",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[tool.uv]
# Rebuild local Python installs when native inputs change, before Python starts.
# Keep source globs scoped to the extension's crates, away from target/ and regression/.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/*/Cargo.toml" },
    { file = "crates/*/build.rs" },
    { file = "crates/texform/src/**/*.rs" },
    { file = "crates/texform-argspec/src/**/*.rs" },
    { file = "crates/texform-core/src/**/*.rs" },
    { file = "crates/texform-interface/src/**/*.rs" },
    { file = "crates/texform-knowledge/src/**/*.rs" },
    { file = "crates/texform-knowledge-macros/src/**/*.rs" },
    { file = "crates/texform-transform/src/**/*.rs" },
    { file = "crates/texform-python/src/**/*.rs" },
    { file = "crates/texform-knowledge/codegen/**/*.rs" },
    { file = "crates/texform-knowledge/resources/**/*.yaml" },
    { file = "python/texform/*.py" },
    { file = "python/texform/*.pyi" },
    { file = "python/texform/py.typed" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
